    <style>
        body {
            min-height: max(884px, 100dvh);
            overflow: hidden;
            background-color: #10141a;
            color: #dfe2eb;
        }

        .hud-scan-line, .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0, 218, 243, 0.5);
            animation: scan 4s linear infinite;
            z-index: 10;
            pointer-events: none;
        }
        
        .scanline {
            height: 100px;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(0, 218, 243, 0.1) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            animation: scanline 8s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        .radar-sweep {
            background: conic-gradient(from 0deg, transparent 70%, rgba(0, 218, 243, 0.8) 100%);
            animation: spin 3s linear infinite;
            border-radius: 50%;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .glass-panel {
            background: rgba(0, 218, 243, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 218, 243, 0.2);
            position: relative;
        }
        .glass-panel::before, .glass-panel::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border: 1px solid theme('colors.primary');
        }
        .glass-panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .glass-panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .tech-border {
            position: relative;
        }
        .tech-border::before, .tech-border::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: theme('colors.primary-fixed-dim');
            border-style: solid;
        }
        .tech-border::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
        .tech-border::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
        
        .glow-box {
            box-shadow: 0 0 10px rgba(0, 218, 243, 0.2) inset, 0 0 5px rgba(0, 218, 243, 0.2);
        }
        
        .text-glow {
            text-shadow: 0 0 8px rgba(0, 218, 243, 0.5);
        }

        .custom-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 2px;
            background: rgba(0, 218, 243, 0.2);
            outline: none;
        }

        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 24px;
            background: #00daf3;
            cursor: pointer;
            border: 1px solid #c3f5ff;
            box-shadow: 0 0 10px rgba(0, 218, 243, 0.5);
        }

        .custom-switch {
            appearance: none;
            width: 48px;
            height: 24px;
            background: rgba(0, 218, 243, 0.1);
            border: 1px solid rgba(0, 218, 243, 0.4);
            border-radius: 0;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .custom-switch::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 18px;
            background: rgba(0, 218, 243, 0.5);
            transition: all 0.3s;
        }

        .custom-switch:checked {
            background: rgba(0, 218, 243, 0.2);
            border-color: #00daf3;
            box-shadow: 0 0 10px rgba(0, 218, 243, 0.3);
        }

        .custom-switch:checked::before {
            left: 24px;
            background: #00daf3;
            box-shadow: 0 0 8px #00daf3;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: theme('colors.primary-fixed-dim'); }

<body class="bg-background text-on-surface font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        // Shared Components
        const Navigation = () => {
            const location = useLocation();
            
            const navItems = [
                { path: '/', icon: 'terminal', label: 'Main Console' },
                { path: '/intel', icon: 'query_stats', label: 'System Intelligence' },
                { path: '/comm', icon: 'satellite_alt', label: 'Comm Hub' },

            return (
                <React.Fragment>
                    {/* Desktop Drawer */}
                    <nav className="hidden md:flex flex-col h-full w-80 border-r border-primary/20 backdrop-blur-3xl bg-surface-container-low/95 z-20 shrink-0">

                            </div>
                            <div>

                                    <div className="absolute inset-0 rounded-full pulse-ring border-2 border-primary"></div>
                                    <div className="text-center z-10">
                                        <span className="block text-headline-lg font-headline-lg text-primary tracking-widest drop-shadow-[0_0_10px_theme('colors.primary')]">98%</span>

                                    </button>

                    </div>

        const SystemIntel = () => (

                    <div className="grid grid-cols-1 md:grid-cols-12 gap-gutter mb-8">

                            <div>

                                    <span className="text-label-caps font-label-caps text-primary tracking-widest uppercase flex items-center gap-2">
                                        <span className="material-symbols-outlined text-[16px]">memory</span> Primary Cortex
                                    </span>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <p className="text-data-display font-data-display text-outline-variant mb-1">COGNITIVE LOAD</p>
                                        <div className="text-headline-md font-headline-md text-primary">78%</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="md:col-span-4 grid grid-cols-2 gap-unit">
                             <div className="bg-surface/30 border border-primary/20 p-3 tech-border">
                                <div className="text-label-caps font-label-caps text-on-surface mb-1">DEFENSE NET</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        const CommHub = () => (
            <div className="flex flex-col h-full overflow-hidden">
                <Header title="COMMS" />
                <div className="flex-1 p-4 md:p-gutter gap-4 overflow-hidden relative pb-24 md:pb-0 z-10">
                     <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 h-full">

        const App = () => {
            return (

                    <Navigation />

                        <Routes>

        const root = createRoot(document.getElementById('root'));
        root.render(
            <MemoryRouter>

            </MemoryRouter>
        );
    </script>
